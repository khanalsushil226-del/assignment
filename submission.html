<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Submission</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submission.css">
</head>
<body>
    <main class="submission-page">
        <div class="submission-container">
            <a href="my-tasks.html" class="back-link">← Back to My Tasks</a>

            <div class="submission-header">
                <h1>Submit Assignment</h1>
                <p>Complete your assignment submission below.</p>
            </div>

            <form id="submissionForm" class="submission-form">
                <div class="form-group">
                    <label for="assignmentTitle">Assignment Title</label>
                    <input type="text" id="assignmentTitle" value="Python Calculator Project" readonly>
                </div>

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" readonly>
                </div>

                <div class="form-group">
                    <label for="assignmentFile">Upload Assignment</label>
                    <input type="file" id="assignmentFile" accept=".pdf,.doc,.docx,.zip" required>
                    <small>Accepted formats: PDF, DOC, DOCX, ZIP</small>
                </div>

                <div class="form-group">
                    <label for="submissionComment">Comment</label>
                    <textarea id="submissionComment" rows="5" placeholder="Add an optional comment"></textarea>
                </div>

                <button type="submit" class="submit-button">
                    Submit Assignment
                </button>

                <p id="submissionMessage"></p>
            </form>
        </div>
    </main>

    <script src="submission.js"></script>
</body>
</html>
